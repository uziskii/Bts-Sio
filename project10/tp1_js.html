<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP - 5 boutons JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ma page interactive</h1>

    <div class="boutons">
        <!-- Bouton 1 relié à la fonction-->
        <button id="btn1" onclick="direBonjour()">Dire bonjour</button>
        <button id="btn2" onclick="afficherDate()">Afficher la date</button>
        <button id="btn3" onclick="changerCouleur()">Changer la couleur</button>
        <button id="btn4" onclick="nombreAleatoire()">Nombre aléatoire</button>
        <button id="btn5" onclick="effacer()">Effacer</button>
        <button id="btn6" onclick="verif_age()">Age</button>
        <button id="btn7" onclick="calculerNotes()">Calculer les notes</button>
    </div>

    <div id="affichage">
        <p id="message">Cliquez sur un bouton.</p>
    </div>
    <script src="tp1.js"></script>
</body>
</html>
