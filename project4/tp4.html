<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body >

    <header>
        <h1>Inscription d'un nouveau client</h1>
    </header>

    <section>

    <form action="#" method="post">
        <table width="70%" border="0">
            <tr>
                <td><label for="name">Nom :</label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>
            <tr>
                <td><label for="prenom">Prénom :</label></td>
                <td><input type="text" id="prenom" name="prenom" required></td>
            </tr>
            <tr>
                <td><label for="date de naissance">Date de naissance :</label></td>
                <td><input type="date" id="date de naissance" name="date de naissance" required></td>
            </tr>
            <tr>
                <td><label for="email">Adresse email :</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="mdp">Mot de passe :</label></td>
                <td><input type="password" id="mdp" name="mdp" required></td>
            </tr>
            <tr>
                <td><label for="permis">Numéro de permis :</label></td>
                <td><input type="text" id="permis" name="permis" required></td>
            </tr>
            <tr>
                <td><label for="anciennete">Nombre d'années d'ancienneté :</label></td>
                <td><input type="number" id="anciennete" name="anciennete"  min="0" max="80" required></td>
            </tr>
            <tr>
                <td><label for="ville">Ville :</label></td>
                <td><select id="ville" name="ville" required>
                    <option value="">Sélectionnez une ville</option>
                    <option value="paris">Paris</option>
                    <option value="versailles">Versailles</option>
                    <option value="creteil">Créteil</option>
                </select></td>
            </tr>
            <tr>
                <td><label for="adresse">Adresse du client :</label></td>
                <td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td>
            </tr>
            <tr>
                <td>Situation matrimoniale :</td>
                <td>
                    <input type="radio" id="marie_oui" name="marie" value="oui">
                    <label for="marie_oui">Marié(e)</label>
                    <input type="radio" id="marie_non" name="marie" value="non">
                    <label for="marie_non">Non marié(e)</label>
                </td>
            </tr>
            <tr>
                <td>Préférence de voiture :</td>
                <td>
                    <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
                    <label for="pref_auto">Automatique</label>
                    <input type="checkbox" id="pref_manual" name="preference_manual" value="manuelle">
                    <label for="pref_manual">Manuelle</label>
                </td>
            </tr>
        </table>
        <button type="submit">Enregistrer</button>
        <button type="reset">Annuler</button>
    </form>

    </section>

    <footer>
        <p>&copy; 2026 Agence Mediterranee - Location de véhicules</p> <br>
        <a href="../index.html">Retour à la page d'accueil</a>
    </footer>


</body>
</html>
